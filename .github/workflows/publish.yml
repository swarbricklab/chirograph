# Publish chirograph to PyPI via trusted publishing (OIDC — no API token).
#
# ARMED: a published GitHub Release now triggers a build + upload. For that upload
# to succeed, the PyPI side must be configured first (otherwise the `publish` job
# fails at the OIDC exchange with `invalid-publisher`):
#
#   1. Register a pending publisher on PyPI (https://pypi.org/manage/account/publishing/):
#        PyPI Project Name: chirograph
#        owner:             swarbricklab
#        repository:        chirograph
#        workflow:          publish.yml
#        environment:       pypi
#   2. Create a GitHub environment named `pypi` (Settings → Environments).
#   3. Cut the release: tag `vX.Y.Z` + publish a GitHub Release. The first upload
#      creates the project and promotes the pending publisher. `workflow_dispatch`
#      stays for manual re-runs.

name: publish

on:
  workflow_dispatch: {}
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir dist .
      - name: Check the distributions
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
