[build-system]
# setuptools-scm was never wired up (the version is static below), so it is dropped;
# setuptools >= 77 gives the SPDX `license` / `license-files` metadata (PEP 639).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chirograph"
version = "0.2.1"
description = "Portable, content-addressed manifests for scientific datasets"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Swarbrick Lab" }]
keywords = ["manifest", "checksum", "provenance", "dvc", "reproducibility", "data"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: System :: Archiving",
  "Typing :: Typed",
]
# Deliberately EMPTY. chirograph is the reference implementation of a file
# format; consumers (notably archivefs) should be able to depend on it without
# inheriting a dependency tree. See docs/decisions.md D-08.
dependencies = []

[project.optional-dependencies]
# `chiro write --from-dvc-cache` parses .dvc / dvc.lock YAML.
dvc = ["PyYAML>=5.1"]
# `chiro validate --jsonschema` checks against the published JSON Schema.
schema = ["jsonschema>=4.0"]
dev = [
  "PyYAML>=5.1",
  "jsonschema>=4.0",
  "pytest>=7",
  "pytest-cov",
  "ruff",
  "mypy",
]

[project.scripts]
chiro = "chirograph.cli:main"
chirograph = "chirograph.cli:main"

[project.urls]
Homepage = "https://github.com/swarbricklab/chirograph"
Repository = "https://github.com/swarbricklab/chirograph"
Issues = "https://github.com/swarbricklab/chirograph/issues"
Changelog = "https://github.com/swarbricklab/chirograph/blob/main/CHANGELOG.md"
Documentation = "https://github.com/swarbricklab/chirograph/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chirograph = ["py.typed", "schemas/*.json", "vectors/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "dvc: tests that require a working `dvc` installation (conformance)",
  "slow: tests that are slow enough to skip during quick iteration",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
  "SIM108",  # ternary-instead-of-if is not always clearer
]

[tool.mypy]
python_version = "3.10"
packages = ["chirograph"]
strict = true
warn_unreachable = true

# PyYAML and jsonschema are optional extras, lazily imported. Requiring their
# stub packages just to type-check the core would defeat the point of keeping
# the runtime dependency-free (docs/decisions.md D-08).
[[tool.mypy.overrides]]
module = ["yaml", "jsonschema", "jsonschema.*"]
ignore_missing_imports = true
